{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add BSD Operating System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div style="text-align: right; margin: 10px;">
        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}!</span>
            <button onclick="window.location.href='{% url 'logout' %}'">Logout</button>
        {% else %}
            <button onclick="window.location.href='{% url 'login' %}'">Login</button>
            <button onclick="window.location.href='{% url 'signup' %}'">Signup</button>
        {% endif %}
    </div>
    
    <u><h1>Add BSD Operating System</h1></u>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'homepage' %}"><button type="button">Cancel</button></a>
    </form>
    
    <p><a href="{% url 'homepage' %}">Back to Home</a></p>
</body>
</html>
