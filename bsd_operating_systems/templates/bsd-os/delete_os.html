{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete - {{ os.name }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div style="text-align: right; margin: 10px;">
        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}!</span>
            <button onclick="window.location.href='{% url 'logout' %}'">Logout</button>
        {% else %}
            <button onclick="window.location.href='{% url 'login' %}'">Login</button>
            <button onclick="window.location.href='{% url 'signup' %}'">Signup</button>
        {% endif %}
    </div>
    
    <u><h1>Delete Operating System</h1></u>
    
    <p>Are you sure you want to delete "{{ os.name }}"?</p>
    <p>This action cannot be undone.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'homepage' %}"><button type="button">Cancel</button></a>
    </form>
    
    <p><a href="{% url 'homepage' %}">Back to Home</a></p>
</body>
</html>
